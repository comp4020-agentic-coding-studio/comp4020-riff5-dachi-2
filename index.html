<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallcrawl</title>
    <meta
      name="description"
      content="Wallcrawl: an 8-bit wall-crawler climbing a skyscraper at night. Slip past the lit windows --- get spotted through one and every window turns into a search light."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Wallcrawl</h1>
      <canvas
        id="game"
        width="300"
        height="500"
        tabindex="0"
        role="application"
        aria-label="Wallcrawl. Use the arrow keys, A and D, or press and hold either side of the screen, to climb the building without being seen through a lit window."
      ></canvas>
      <p id="live" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
