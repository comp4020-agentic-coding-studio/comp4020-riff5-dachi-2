<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swerve: Trap</title>
    <meta
      name="description"
      content="Swerve: Trap flips the dodging game around --- you block lanes, an AI swerves to survive them. Corner it before it outruns your reflexes."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Swerve: Trap</h1>
      <canvas
        id="game"
        width="300"
        height="500"
        tabindex="0"
        role="application"
        aria-label="Swerve: Trap. Press 1, 2 or 3 to block a lane, or click one, and corner the AI dodger before it escapes."
      ></canvas>
      <p id="live" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
